<body>

<script>
"use strict";
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("scene");
const $   = id => document.getElementById(id);

/* ---------- tiny helpers ---------- */
const lerp  = (a,b,u)=>a+(b-a)*u;
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const ease  = u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
function el(tag,attrs,parent){
  const n=document.createElementNS(NS,tag);
  for(const k in attrs) n.setAttribute(k,attrs[k]);
  if(parent) parent.appendChild(n);
  return n;
}
function wrapX(base,speed,t,range,pad){
  const m=range+pad*2;
  return ((base - t*speed) % m + m) % m - pad;
}
function sampleKF(kf,p){
  if(p<=kf[0][0]) return kf[0][1];
  for(let i=0;i<kf.length-1;i++){
    const a=kf[i],b=kf[i+1];
    if(p>=a[0]&&p<=b[0]){
      const u=(p-a[0])/(b[0]-a[0]||1);
      return lerp(a[1],b[1],ease(u));
    }
  }
  return kf[kf.length-1][1];
}
function sampleKF2(kf,p){
  if(p<=kf[0][0]) return {x:kf[0][1],y:kf[0][2]};
  for(let i=0;i<kf.length-1;i++){
    const a=kf[i],b=kf[i+1];
    if(p>=a[0]&&p<=b[0]){
      const u=(p-a[0])/(b[0]-a[0]||1);
      const e=ease(u);
      return {x:lerp(a[1],b[1],e), y:lerp(a[2],b[2],e)};
    }
  }
  const l=kf[kf.length-1]; return {x:l[1],y:l[2]};
}

/* =============================================================
   BACKGROUND
============================================================= */
function buildBackground(){
  const rays=$("sunRays");
  for(let i=0;i<12;i++){
    const a=i/12*Math.PI*2;
    el("line",{x1:1046+Math.cos(a)*66, y1:112+Math.sin(a)*66,
               x2:1046+Math.cos(a)*86, y2:112+Math.sin(a)*86,
               stroke:"#ffd75e","stroke-width":6,"stroke-linecap":"round",opacity:.7},rays);
  }

  const clouds=$("clouds");
  const cloudDefs=[
    {x:160,y:120,s:1.0},{x:520,y:80,s:.8},{x:820,y:150,s:1.15},
    {x:1080,y:90,s:.7},{x:300,y:210,s:.6}
  ];
  cloudDefs.forEach(c=>{
    const g=el("g",{},clouds);
    el("ellipse",{cx:0,cy:0,rx:46*c.s,ry:26*c.s,fill:"#fff"},g);
    el("ellipse",{cx:40*c.s,cy:8*c.s,rx:34*c.s,ry:20*c.s,fill:"#fff"},g);
    el("ellipse",{cx:-38*c.s,cy:10*c.s,rx:30*c.s,ry:18*c.s,fill:"#f3f9ff"},g);
    c._g=g;
  });
  clouds._defs=cloudDefs;

  // hills (tiled, period 1200)
  const hills=$("hills");
  [-1000, 200, 1400, 2600].forEach(hx=>{
    el("ellipse",{cx:hx,cy:560,rx:420,ry:150,fill:"#8fd08f"},hills);
    el("ellipse",{cx:hx+260,cy:590,rx:300,ry:120,fill:"#a9dc9a"},hills);
  });

  // center dashes (tiled, period 90)
  const stripes=$("stripes");
  for(let i=0;i<16;i++){
    el("rect",{x:i*90-90,y:544,width:46,height:10,rx:5,fill:"#f4f7fa"},stripes);
  }

  // roadside (tiled, period 400)
  const road=$("roadside");
  const tree=(x)=>{
    const g=el("g",{},road);
    el("rect",{x:x-8,y:430,width:16,height:74,rx:6,fill:"#8a5a34"},g);
    el("circle",{cx:x,cy:410,r:44,fill:"#3f9d4f"},g);
    el("circle",{cx:x-30,cy:430,r:30,fill:"#49b35b"},g);
    el("circle",{cx:x+30,cy:430,r:30,fill:"#378f47"},g);
  };
  const sign=(x)=>{
    const g=el("g",{},road);
    el("rect",{x:x-5,y:430,width:10,height:74,rx:4,fill:"#9aa3ad"},g);
    el("rect",{x:x-52,y:392,width:104,height:44,rx:8,fill:"#fff3b0",stroke:"#333","stroke-width":3},g);
    el("text",{x:x,y:421,"text-anchor":"middle","font-size":22,"font-weight":"bold",
               "font-family":"Segoe UI, sans-serif",fill:"#333"},g).textContent="誰騎誰?";
  };
  const cactus=(x)=>{
    const g=el("g",{},road);
    el("rect",{x:x-9,y:420,width:18,height:84,rx:9,fill:"#4fae63"},g);
    el("rect",{x:x-34,y:440,width:26,height:12,rx:6,fill:"#4fae63"},g);
    el("rect",{x:x-34,y:418,width:12,height:36,rx:6,fill:"#4fae63"},g);
  };
  for(let i=-1;i<5;i++){
    tree(60+i*400);
    cactus(260+i*400);
    if(i===0||i===2) sign(160+i*400);
  }
}

/* =============================================================
   PELICAN (unchanged: hopping chaser with the whip)
============================================================= */
function buildPelican(){
  const P=$("pelican");
  const body=el("g",{id:"pelicanBody"},P);

  const legs=el("g",{id:"pelicanLegs"},P);
  const mkLeg=(phase)=>{
    const g=el("g",{},legs);
    const thigh=el("line",{x1:0,y1:0,x2:0,y2:0,stroke:"#f08a2b","stroke-width":12,"stroke-linecap":"round"},g);
    const shin =el("line",{x1:0,y1:0,x2:0,y2:0,stroke:"#f08a2b","stroke-width":11,"stroke-linecap":"round"},g);
    const foot =el("path",{d:"",fill:"#ff9d33",stroke:"#d9741c","stroke-width":2},g);
    return {g,thigh,shin,foot,phase};
  };
  const legA=mkLeg(0), legB=mkLeg(Math.PI);

  el("path",{d:"M300,392 C250,360 235,410 285,430 C255,440 265,470 320,455 C275,470 320,500 360,470 Z",
             fill:"#e9eef5",stroke:"#c4cdd9","stroke-width":3},body);
  el("ellipse",{cx:360,cy:405,rx:88,ry:58,fill:"url(#pelicanBody)",stroke:"#c4cdd9","stroke-width":3},body);
  el("path",{d:"M300,440 C340,470 420,468 448,432 C420,470 330,474 300,440 Z",fill:"#dbe4ee",opacity:.8},body);

  el("path",{d:"M420,392 C470,388 470,350 452,332 C440,320 452,306 470,300",
             fill:"none",stroke:"#ffffff","stroke-width":26,"stroke-linecap":"round"},body);
  el("path",{d:"M420,392 C470,388 470,350 452,332 C440,320 452,306 470,300",
             fill:"none",stroke:"#dfe6ee","stroke-width":4,opacity:.6},body);

  el("circle",{cx:474,cy:296,r:27,fill:"#ffffff",stroke:"#c4cdd9","stroke-width":3},body);
  el("circle",{cx:482,cy:288,r:6.5,fill:"#20242b"},body);
  el("circle",{cx:484,cy:286,r:2.2,fill:"#fff"},body);
  el("path",{id:"pelicBrow",d:"M470,278 L494,286",stroke:"#20242b","stroke-width":4,"stroke-linecap":"round"},body);

  el("path",{d:"M492,282 L592,296 L592,304 L492,306 Z",fill:"#ffb347",stroke:"#d9741c","stroke-width":2.5},body);
  el("path",{id:"pouch",
             d:"M492,306 C520,352 560,352 592,306 C560,320 520,320 492,306 Z",
             fill:"url(#pouch)",stroke:"#c85a12","stroke-width":2.5},body);

  const wing=el("g",{id:"pelicanWing"},P);
  el("path",{d:"M392,392 C440,378 486,372 512,378 C486,404 440,412 392,392 Z",
             fill:"#dfe7f1",stroke:"#b9c4d3","stroke-width":3},wing);
  el("circle",{id:"whipHand",cx:512,cy:380,r:12,fill:"#f08a2b",stroke:"#d9741c","stroke-width":3},P);

  P._={body,legs,legA,legB,wing,pouch:$("pouch"),brow:$("pelicBrow")};
}

/* =============================================================
   THE MAN — on the ground, pumping, being ridden by the bike
============================================================= */
const MAN={ hip:{x:790,y:455}, shoulder:{x:850,y:415}, head:{x:872,y:396} };

function mkLimb(g,thick,thickF,color,colorF){
  const gL=el("g",{},g);
  gL._thigh=el("line",{stroke:color,"stroke-width":thick,"stroke-linecap":"round"},gL);
  gL._shin =el("line",{stroke:colorF,"stroke-width":thickF,"stroke-linecap":"round"},gL);
  gL._shoe =el("path",{fill:"#1b1f26"},gL);
  return gL;
}
function mkArm(g,thick,color){
  const gL=el("g",{},g);
  gL._upper=el("line",{stroke:color,"stroke-width":thick,"stroke-linecap":"round"},gL);
  gL._fore =el("line",{stroke:color,"stroke-width":thick-2,"stroke-linecap":"round"},gL);
  gL._hand =el("circle",{r:8,fill:"#f2c9a0",stroke:"#d8a074","stroke-width":2},gL);
  return gL;
}
const shoePath=(x,y)=>
  `M${x-8},${y} C${x-4},${y-9} ${x+16},${y-9} ${x+22},${y} C${x+12},${y+6} ${x-4},${y+6} ${x-8},${y} Z`;

function buildMan(){
  const g=$("man");

  // speed lines (behind everything, inside the man group)
  const speed=el("g",{id:"speed"},g);
  speed._lines=[
    el("line",{x1:700,y1:432,x2:748,y2:432,stroke:"#ffffff","stroke-width":5,"stroke-linecap":"round"},speed),
    el("line",{x1:688,y1:458,x2:742,y2:458,stroke:"#ffffff","stroke-width":5,"stroke-linecap":"round"},speed),
    el("line",{x1:702,y1:484,x2:752,y2:484,stroke:"#ffffff","stroke-width":5,"stroke-linecap":"round"},speed),
  ];

  // far limbs (drawn first = behind)
  const farArm=mkArm(g,12,"#d97a1e");
  const farLeg=mkLimb(g,15,13,"#b3541e","#9c4718");

  // near leg (over torso)
  const nearLeg=mkLimb(g,18,16,"#e08a2a","#c9731f");

  // torso + head
  const torso=el("g",{id:"torsoG"},g);
  el("circle",{cx:MAN.hip.x+8,cy:MAN.hip.y-4,r:13,fill:"#f2c9a0"},torso); // hip (behind the shirt)
  el("line",{x1:MAN.hip.x,y1:MAN.hip.y,x2:MAN.shoulder.x,y2:MAN.shoulder.y,
             stroke:"#ff9f40","stroke-width":30,"stroke-linecap":"round"},torso);

  const head=el("g",{id:"manHead"},torso);
  // helmet
  el("path",{d:"M850,394 C852,368 892,366 896,394 C878,385 864,385 850,394 Z",
             fill:"#ff5a5a",stroke:"#c83a3a","stroke-width":2.5},head);
  el("line",{x1:864,y1:372,x2:866,y2:390,stroke:"#c83a3a","stroke-width":2},head);
  el("line",{x1:880,y1:371,x2:880,y2:390,stroke:"#c83a3a","stroke-width":2},head);
  // face
  el("circle",{cx:872,cy:396,r:22,fill:"#f2c9a0",stroke:"#d8a074","stroke-width":2.5},head);
  // normal determined eyes + gritted teeth
  const eyesN=el("g",{id:"eyesN"},head);
  el("circle",{cx:872,cy:392,r:2.8,fill:"#20242b"},eyesN);
  el("circle",{cx:884,cy:390,r:2.8,fill:"#20242b"},eyesN);
  const browN=el("path",{id:"browN",d:"M864,384 L890,388",stroke:"#20242b","stroke-width":3,
                        "stroke-linecap":"round"},head);
  const mouthN=el("g",{id:"mouthN"},head);
  el("rect",{x:874,y:401,width:16,height:9,rx:2,fill:"#ffffff",stroke:"#a8523a","stroke-width":1.6},mouthN);
  el("line",{x1:880,y1:401,x2:880,y2:410,stroke:"#a8523a","stroke-width":1.4},mouthN);
  el("line",{x1:886,y1:401,x2:886,y2:410,stroke:"#a8523a","stroke-width":1.4},mouthN);
  // pain face: X eyes, worried brow, screaming mouth
  const eyesP=el("g",{id:"eyesP",style:"display:none"},head);
  el("path",{d:"M868,388 L876,394 M876,388 L868,394",stroke:"#20242b","stroke-width":2.6,"stroke-linecap":"round"},eyesP);
  el("path",{d:"M880,386 L888,392 M888,386 L880,392",stroke:"#20242b","stroke-width":2.6,"stroke-linecap":"round"},eyesP);
  const browP=el("path",{id:"browP",d:"M866,380 L878,384 M882,384 L892,379",stroke:"#20242b",
                        "stroke-width":3,"stroke-linecap":"round",style:"display:none"},head);
  const mouthP=el("ellipse",{id:"mouthP",cx:885,cy:406,rx:6,ry:8,fill:"#7a2f24",
                           stroke:"#a8523a","stroke-width":2,style:"display:none"},head);
  // tear / sweat
  const sweat=el("path",{id:"sweat",d:"M850,382 C844,390 846,398 852,396 C856,394 854,386 850,382 Z",
                     fill:"#8fd0ff",stroke:"#4aa6e0","stroke-width":1.5,style:"display:none"},head);

  // near arm (over torso)
  const nearArm=mkArm(g,14,"#ff9f40");

  g._={g,speed,lines:speed._lines,farArm,farLeg,nearLeg,nearArm,torso,head,
       eyesN,eyesP,browN,browP,mouthN,mouthP,sweat};
}

/* =============================================================
   THE BIKE — riderless, perched on the man's back, "riding" him
============================================================= */
const B={
  rRear:{x:778,y:372}, rFront:{x:948,y:372},
  bb:{x:845,y:388}, saddle:{x:820,y:292}, head:{x:930,y:300},
  crank:20
};
function buildBike(){
  const g=$("bike");
  const frame="url(#frame)";
  const line=(a,b,w,c)=>el("line",{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:c||frame,"stroke-width":w||9,"stroke-linecap":"round"},g);

  const mkWheel=(c)=>{
    const wg=el("g",{},g);
    el("circle",{cx:c.x,cy:c.y,r:53,fill:"none",stroke:"#1b1f26","stroke-width":9},wg);
    el("circle",{cx:c.x,cy:c.y,r:44,fill:"none",stroke:"#2b3038","stroke-width":3},wg);
    const spokes=el("g",{},wg);
    for(let i=0;i<8;i++){
      const a=i/8*Math.PI*2;
      el("line",{x1:c.x,y1:c.y,x2:c.x+Math.cos(a)*44,y2:c.y+Math.sin(a)*44,
                 stroke:"#565e69","stroke-width":3},spokes);
    }
    el("circle",{cx:c.x,cy:c.y,r:7,fill:"#c7ced8",stroke:"#39404a","stroke-width":3},wg);
    return spokes;
  };
  const spRear=mkWheel(B.rRear);
  const spFront=mkWheel(B.rFront);

  line(B.bb,B.saddle);      // seat tube
  line(B.saddle,B.head);    // top tube
  line(B.bb,B.head);        // down tube
  line(B.rRear,B.bb);       // chainstay
  line(B.rRear,B.saddle);   // seatstay
  line(B.head,B.rFront);    // fork
  el("line",{x1:B.head.x,y1:B.head.y,x2:B.head.x+4,y2:B.head.y-30,stroke:frame,"stroke-width":9,"stroke-linecap":"round"},g);

  el("ellipse",{cx:B.saddle.x-2,cy:B.saddle.y-4,rx:20,ry:8,fill:"#20242b"},g);
  el("path",{d:"M938,262 C954,258 966,268 964,284",fill:"none",stroke:"#20242b","stroke-width":8,"stroke-linecap":"round"},g);
  el("circle",{cx:964,cy:284,r:7,fill:"#20242b"},g);

  // crank + pedals (pedaling by itself — nobody is driving it!)
  const crank=el("g",{id:"crank"},g);
  const arm1=el("line",{x1:B.bb.x,y1:B.bb.y,x2:0,y2:0,stroke:"#39404a","stroke-width":8,"stroke-linecap":"round"},crank);
  const arm2=el("line",{x1:B.bb.x,y1:B.bb.y,x2:0,y2:0,stroke:"#2c323b","stroke-width":8,"stroke-linecap":"round"},crank);
  const pedNear=el("line",{x1:0,y1:0,x2:16,y2:0,stroke:"#20242b","stroke-width":7,"stroke-linecap":"round"},crank);
  const pedFar =el("line",{x1:0,y1:0,x2:-16,y2:0,stroke:"#14181d","stroke-width":7,"stroke-linecap":"round"},crank);
  el("circle",{cx:B.bb.x,cy:B.bb.y,r:9,fill:"#39404a"},g);

  // smug little face on the frame (the bike is the rider here)
  const face=el("g",{id:"bikeFace"},g);
  el("path",{d:"M854,331 Q858,326 862,331",fill:"none",stroke:"#3b1d1d","stroke-width":2.4,"stroke-linecap":"round"},face);
  el("path",{d:"M870,329 Q874,324 878,329",fill:"none",stroke:"#3b1d1d","stroke-width":2.4,"stroke-linecap":"round"},face);
  el("path",{d:"M858,339 Q866,345 876,337",fill:"none",stroke:"#3b1d1d","stroke-width":2.4,"stroke-linecap":"round"},face);

  g._={spRear,spFront,crank,arm1,arm2,pedNear,pedFar};
}

/* =============================================================
   FX (impact star, ring, text)
============================================================= */
function buildFX(){
  const fx=$("fx");
  const star=el("g",{id:"star",style:"display:none"},fx);
  for(let i=0;i<8;i++){
    const a=i/8*Math.PI*2;
    el("line",{x1:0,y1:0,x2:Math.cos(a)*26,y2:Math.sin(a)*26,
               stroke:"#ffcf4d","stroke-width":5,"stroke-linecap":"round"},star);
  }
  el("circle",{cx:0,cy:0,r:12,fill:"#fff3b0",opacity:.9},star);
  const ring=el("circle",{id:"ring",cx:0,cy:0,r:10,fill:"none",stroke:"#ff9d33","stroke-width":4,
                         style:"display:none"},fx);
  const txt=el("text",{id:"fxText","font-family":"Segoe UI, sans-serif","font-weight":"900",
                      "text-anchor":"middle",fill:"#fff3b0",stroke:"#d63b3b","stroke-width":1,
                      "paint-order":"stroke",style:"display:none"},fx);
  fx._={star,ring,txt};
}

/* =============================================================
   WHIP — now strikes the MAN's lower back (under the bike)
============================================================= */
function buildWhip(){
  const g=el("g",{id:"whipG"},svg);
  const swoosh=el("path",{id:"swoosh",d:"",fill:"none",stroke:"#ffffff",
                         "stroke-width":16,"stroke-linecap":"round",opacity:0},g);
  const path=el("path",{id:"whip",d:"",fill:"none",stroke:"#7a4a21","stroke-width":7,
                       "stroke-linecap":"round"},g);
  const path2=el("path",{id:"whip2",d:"",fill:"none",stroke:"#5a3416","stroke-width":3,
                        "stroke-linecap":"round",opacity:.7},g);
  const tip=el("circle",{id:"whipTip",r:5,fill:"#5a3416"},g);
  g._={swoosh,path,path2,tip};
}

/* =============================================================
   ANIMATION
============================================================= */
const HAND_BASE={x:512,y:380};
const WHIP={
  cycle:1.4,
  hitPhase:0.70,                 // seconds within cycle when the tip lands on the man
  hand:{x:512,y:380},
  tipKF:[
    [0.00, 640, 350],
    [0.20, 656, 246],            // cock up
    [0.36, 692, 316],
    [0.50, 788, 438],            // HIT — man's lower back, under the rear wheel
    [0.62, 830, 478],            // follow-through
    [0.80, 700, 380],
    [1.00, 640, 350],
  ],
  bendKF:[
    [0.00, 46],[0.20, 92],[0.36, 60],[0.50, 12],[0.62, 26],[0.80, 46],[1.00, 46]
  ],
};

function lastHitTime(t){
  const {cycle,hitPhase}=WHIP;
  if(t<hitPhase) return -1e9;
  const n=Math.floor((t-hitPhase)/cycle + 1e-9);
  return hitPhase + n*cycle;
}

function setWhip(p){
  const tip=sampleKF2(WHIP.tipKF,p);
  const bend=sampleKF(WHIP.bendKF,p);
  const S=WHIP.hand;
  const M={x:(S.x+tip.x)/2,y:(S.y+tip.y)/2};
  let vx=tip.x-S.x, vy=tip.y-S.y;
  const len=Math.hypot(vx,vy)||1;
  let n1={x:-vy/len,y:vx/len}, n2={x:vy/len,y:-vx/len};
  const n = n1.y < n2.y ? n1 : n2;   // arc bows upward
  const C={x:M.x+n.x*bend, y:M.y+n.y*bend};
  const d=`M${S.x},${S.y} Q${C.x},${C.y} ${tip.x},${tip.y}`;
  const W=svg._whip;
  W.path.setAttribute("d",d);
  W.path2.setAttribute("d",d);
  W.tip.setAttribute("cx",tip.x); W.tip.setAttribute("cy",tip.y);

  const whoosh=clamp(1-Math.abs(p-0.5)/0.14,0,1);
  W.swoosh.setAttribute("opacity",(whoosh*0.5).toFixed(3));
  if(whoosh>0.02){
    W.swoosh.setAttribute("d",`M${S.x},${S.y} Q${C.x+n.x*10},${C.y+n.y*10} ${tip.x},${tip.y}`);
  }
  WHIP._lastTip=tip;
}

/* 2-bone IK: knee/elbow between two points; pick bend side by height */
function ikKnee(hip,foot,L1,L2,bendSign){
  let dx=foot.x-hip.x, dy=foot.y-hip.y;
  let d=Math.hypot(dx,dy);
  const maxD=L1+L2-0.01, minD=Math.abs(L1-L2)+0.01;
  d=clamp(d,minD,maxD);
  const a=Math.atan2(dy,dx);
  const cos=(L1*L1+d*d-L2*L2)/(2*L1*d);
  const theta=Math.acos(clamp(cos,-1,1));
  const ang=a+bendSign*theta;
  return {x:hip.x+L1*Math.cos(ang), y:hip.y+L1*Math.sin(ang)};
}
const ikUp  =(h,f,L1,L2)=>{const a=ikKnee(h,f,L1,L2,+1),b=ikKnee(h,f,L1,L2,-1);return a.y<b.y?a:b;};
const ikDown=(h,f,L1,L2)=>{const a=ikKnee(h,f,L1,L2,+1),b=ikKnee(h,f,L1,L2,-1);return a.y>b.y?a:b;};

function setLine(e,x1,y1,x2,y2){
  e.setAttribute("x1",x1);e.setAttribute("y1",y1);
  e.setAttribute("x2",x2);e.setAttribute("y2",y2);
}

let t0=performance.now();

/* ---------- pause / resume (PolyU UI button) ---------- */
const toggleBtn=$("toggleBtn"), badge=$("badge"), badgeText=$("badgeText");
let paused=false, pausedAt=0;
toggleBtn.addEventListener("click",()=>{
  if(paused){
    t0+=performance.now()-pausedAt;   // keep the timeline continuous
    paused=false;
    toggleBtn.textContent="暫停";
    badge.classList.remove("paused");
    badgeText.textContent="Running";
    requestAnimationFrame(frame);
  } else {
    pausedAt=performance.now();
    paused=true;
    toggleBtn.textContent="繼續";
    badge.classList.add("paused");
    badgeText.textContent="Paused";
  }
});

function frame(now){
  if(paused) return;
  const t=(now-t0)/1000;

  /* ---------- background scroll ---------- */
  const speed=230;
  const clouds=svg._clouds;
  clouds._defs.forEach(c=>{
    const x=wrapX(c.x, speed*0.35, t, 1200, 160);
    c._g.setAttribute("transform",`translate(${x},${c.y})`);
  });
  $("hills").setAttribute("transform",`translate(${-(t*speed*0.2)%1200},0)`);
  $("stripes").setAttribute("transform",`translate(${-(t*speed)%90},0)`);
  $("roadside").setAttribute("transform",`translate(${-(t*speed)%400},0)`);

  /* ---------- pelican hop + legs ---------- */
  const hop=Math.abs(Math.sin(t*4.2));
  const py=-(hop*20)-2;
  const px=Math.sin(t*4.2)*6;
  const P=svg._pelican;
  P.body.setAttribute("transform",`translate(${px},${py})`);
  P.legs.setAttribute("transform",`translate(${px},${py})`);
  P.wing.setAttribute("transform",`translate(${px},${py}) rotate(${-6+hop*8},392,392)`);
  if(P.hand) P.hand.setAttribute("transform",`translate(${px},${py})`);
  WHIP.hand={x:HAND_BASE.x+px, y:HAND_BASE.y+py};

  [P.legA,P.legB].forEach(L=>{
    const s=Math.sin(t*8+L.phase);
    const hipL={x:L.phase===0?350:378, y:452};
    const footX=hipL.x+s*26;
    const lift=Math.max(0,Math.sin(t*8+L.phase+Math.PI/2))*10;
    const foot={x:footX, y:500-lift};
    const knee=ikKnee(hipL,foot,30,30,+1);
    setLine(L.thigh,hipL.x,hipL.y,knee.x,knee.y);
    setLine(L.shin,knee.x,knee.y,foot.x,foot.y);
    L.foot.setAttribute("d",
      `M${foot.x-6},${foot.y} C${foot.x-2},${foot.y-8} ${foot.x+18},${foot.y-8} ${foot.x+24},${foot.y} `+
      `C${foot.x+14},${foot.y+6} ${foot.x-2},${foot.y+6} ${foot.x-6},${foot.y} Z`);
  });

  const p=t%WHIP.cycle;
  const exc=clamp(1-Math.abs(p-WHIP.hitPhase)/0.35,0,1);
  P.brow.setAttribute("d",`M470,${278+exc*3} L494,${286+exc*2}`);
  const ps=1+exc*0.08;
  P.pouch.setAttribute("transform",`translate(542,306) scale(1 ${ps}) translate(-542,-306)`);

  /* ---------- whip ---------- */
  const whipP=(t%WHIP.cycle)/WHIP.cycle;
  setWhip(whipP);

  /* ---------- hit state ---------- */
  const lh=lastHitTime(t);
  const flinchDur=0.5;
  const flinch=(lh>-1e8 && t-lh>=0 && t-lh<flinchDur) ? (1-ease(clamp((t-lh)/flinchDur,0,1))) : 0;

  /* ---------- THE MAN (pumping along, reacting to hits) ---------- */
  const man=svg._man;
  const stride=t*7;
  const bobM=2.5*Math.sin(t*14);
  const shakeX=Math.sin(t*62)*2*flinch;

  // whole-man lurch forward (whip shoves him) + squash on impact
  const sq=flinch*0.07;
  man.g.setAttribute("transform",
    `translate(${10*flinch+shakeX},${bobM}) `+
    `translate(830,498) scale(${1+sq},${1-sq}) translate(-830,-498)`);

  // speed lines flicker
  man.lines.forEach((L,i)=>{
    L.setAttribute("opacity",(0.18+0.3*(0.5+0.5*Math.sin(t*16+i*2.1))).toFixed(3));
    L.setAttribute("transform",`translate(${-4*Math.sin(t*16+i*2.1)},0)`);
  });

  // legs pump
  const footAt=ph=>({x:MAN.hip.x+34*Math.sin(ph), y:497-14*Math.max(0,Math.cos(ph))});
  function setManLeg(leg,foot){
    const knee=ikKnee(MAN.hip,foot,48,50,-1); // consistent forward bend (knee leads, toward the bike)
    setLine(leg._thigh,MAN.hip.x,MAN.hip.y,knee.x,knee.y);
    setLine(leg._shin,knee.x,knee.y,foot.x,foot.y);
    leg._shoe.setAttribute("d",shoePath(foot.x,foot.y));
  }
  setManLeg(man.farLeg ,footAt(stride+Math.PI));
  setManLeg(man.nearLeg,footAt(stride));

  // torso leans forward into the hit; head jolts; arms flail up
  man.torso.setAttribute("transform",`rotate(${8*flinch},${MAN.hip.x},${MAN.hip.y})`);
  man.head.setAttribute("transform",
    `translate(${6*flinch},${3*flinch}) rotate(${14*flinch},852,415)`);

  const handAt=ph=>({x:MAN.shoulder.x+26*Math.sin(ph), y:446-10*Math.max(0,Math.cos(ph))-14*flinch});
  function setManArm(arm,hand){
    const elb=ikDown(MAN.shoulder,hand,30,34);
    setLine(arm._upper,MAN.shoulder.x,MAN.shoulder.y,elb.x,elb.y);
    setLine(arm._fore,elb.x,elb.y,hand.x,hand.y);
    arm._hand.setAttribute("cx",hand.x);
    arm._hand.setAttribute("cy",hand.y);
  }
  setManArm(man.farArm ,handAt(stride));
  setManArm(man.nearArm,handAt(stride+Math.PI));

  // face: gritted-teeth effort <-> screaming pain
  const pain=flinch>0.4;
  man.eyesN.style.display = pain?"none":"";
  man.eyesP.style.display = pain?"":"none";
  man.browN.style.display = pain?"none":"";
  man.browP.style.display = pain?"":"none";
  man.mouthN.style.display= pain?"none":"";
  man.mouthP.style.display= pain?"":"none";
  man.sweat.style.display  = (flinch>0.15)?"":"none";
  if(flinch>0.15){
    const dy=(1-flinch)*30;
    man.sweat.setAttribute("transform",`translate(0,${dy})`);
  }

  /* ---------- THE BIKE (riding the man) ---------- */
  const bike=svg._bike;
  const bobB=bobM+0.8*Math.sin(t*2.3+1);
  const tilt=2.2*Math.sin(t*7+0.5);
  $("bike").setAttribute("transform",
    `translate(${14*flinch+shakeX},${bobB}) rotate(${tilt},863,380)`);

  // wheels spin in place
  const deg=(t*240)%360;
  bike.spRear .setAttribute("transform",`rotate(${deg},778,372)`);
  bike.spFront.setAttribute("transform",`rotate(${deg},948,372)`);

  // pedals keep turning by themselves
  const crank=t*5;
  const ped1={x:B.bb.x+B.crank*Math.cos(crank),     y:B.bb.y+B.crank*Math.sin(crank)};
  const ped2={x:B.bb.x+B.crank*Math.cos(crank+Math.PI),y:B.bb.y+B.crank*Math.sin(crank+Math.PI)};
  setLine(bike.arm1,B.bb.x,B.bb.y,ped1.x,ped1.y);
  setLine(bike.arm2,B.bb.x,B.bb.y,ped2.x,ped2.y);
  bike.pedNear.setAttribute("transform",`translate(${ped1.x},${ped1.y})`);
  bike.pedFar .setAttribute("transform",`translate(${ped2.x},${ped2.y})`);

  /* ---------- FX ---------- */
  const FX=svg._fx;
  if(lh>-1e8){
    const dt=t-lh;
    if(dt>=0 && dt<0.5){
      const tip=WHIP._lastTip||{x:788,y:438};
      const pop=ease(clamp(dt/0.18,0,1));
      const fade=1-clamp(dt/0.45,0,1);
      FX.star.style.display="";
      FX.star.setAttribute("transform",`translate(${tip.x},${tip.y}) scale(${0.4+pop*1.1})`);
      FX.star.setAttribute("opacity",fade.toFixed(3));

      FX.ring.style.display="";
      FX.ring.setAttribute("cx",tip.x);FX.ring.setAttribute("cy",tip.y);
      FX.ring.setAttribute("r",10+dt*90);FX.ring.setAttribute("opacity",(fade*0.8).toFixed(3));

      const words=["痛!!","OUCH!","啪!","誰騎我?","好痛"];
      FX.txt.style.display="";
      FX.txt.setAttribute("x",tip.x);
      FX.txt.setAttribute("y",tip.y-46-(1-fade)*30);
      FX.txt.setAttribute("font-size",(26+pop*14).toFixed(1));
      FX.txt.setAttribute("opacity",fade.toFixed(3));
      FX.txt.textContent=words[Math.floor(lh/WHIP.cycle)%words.length];
    } else {
      FX.star.style.display="none";
      FX.ring.style.display="none";
      FX.txt.style.display="none";
    }
  } else {
    FX.star.style.display="none";
    FX.ring.style.display="none";
    FX.txt.style.display="none";
  }

  requestAnimationFrame(frame);
}

/* ---------- wire private refs ---------- */
function wire(){
  svg._clouds=$("clouds");
  svg._pelican=$("pelican")._;
  svg._pelican.hand=$("whipHand");
  svg._man=$("man")._;
  svg._bike=$("bike")._;
  svg._fx=$("fx")._;
  svg._whip=$("whipG")._;
}

buildBackground();
buildPelican();
buildMan();
buildBike();
buildFX();
buildWhip();
wire();
requestAnimationFrame(frame);
</script>
</body>
