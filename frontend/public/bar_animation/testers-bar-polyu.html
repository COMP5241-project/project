<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>測試工程師與酒吧 — 動態 SVG 故事</title>
<style>
  /* ---------- PolyU EduGenAI 品牌風格（README §1） ---------- */
  :root{
    --primary:#A21942;          /* Primary (PolyU Brick Red) */
    --primary-hover:#801333;
    --ink:#262626;              /* Secondary (Dark Slate/Charcoal) */
    --bg:#F8F9FA;               /* Background Accent (Light Grey) */
    --line:#E5E7EB;             /* Card Borders / Dividers */
    --muted:#6B7280;
    --green:#10B981;            /* Success / Progress Green */
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; color:var(--ink); background:var(--bg);
    font-family:Inter,system-ui,-apple-system,"Segoe UI","Noto Sans TC","Microsoft JhengHei","PingFang TC","Heiti TC",sans-serif;
    display:flex; justify-content:center;
  }
  /* Layout: max-w-7xl mx-auto px-4 */
  .wrap{ width:min(80rem, 100%); padding:24px 16px 48px; }
  h1{
    text-align:center; font-size:clamp(20px,3vw,30px); letter-spacing:.08em; font-weight:700;
    margin:8px 0 6px; color:var(--ink);
  }
  h1 .sub{ display:block; font-size:13px; color:var(--muted); letter-spacing:.3em; margin-top:8px; font-weight:400; }
  /* Cards: bg-white rounded-lg border border-gray-200 shadow-sm */
  .stage-card, .player{
    background:#fff; border:1px solid var(--line); border-radius:8px;
    box-shadow:0 1px 2px 0 rgb(0 0 0 / .05);
  }
  .stage-card{ overflow:hidden; }
  svg#stage{ display:block; width:100%; height:auto; background:#0d0a16; }
  /* Card: p-6 */
  .player{ margin-top:16px; padding:24px; }
  .caption{
    min-height:52px; font-size:clamp(16px,2vw,19px);
    text-align:center; line-height:1.6; color:var(--ink);
  }
  .divider{ height:1px; background:var(--line); margin:20px 0; }
  .hud{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .scene-num{ font-size:13px; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .progress{ flex:1; height:8px; background:var(--line); border-radius:999px; overflow:hidden; min-width:110px; }
  .progress > div{ height:100%; width:0%; background:var(--green); border-radius:999px; transition:width .3s ease; }
  /* Buttons: rounded-md px-4 py-2 font-medium + transition-colors；主色 #A21942 / hover #801333 */
  button{
    background:#fff; color:var(--ink); border:1px solid var(--line); border-radius:6px;
    padding:8px 16px; font-size:14px; font-weight:500; line-height:1.25; cursor:pointer; font-family:inherit;
    transition:background-color .15s ease, border-color .15s ease, color .15s ease;
  }
  button:hover{ background:var(--bg); border-color:#D1D5DB; }
  button:active{ transform:translateY(1px); }
  button.primary{ background:var(--primary); border-color:var(--primary); color:#fff; }
  button.primary:hover{ background:var(--primary-hover); border-color:var(--primary-hover); }
  button:focus-visible, select:focus-visible{ outline:2px solid var(--primary); outline-offset:2px; }
  select{
    background:#fff; color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:8px 12px;
    font-family:inherit; font-size:14px; cursor:pointer;
    transition:background-color .15s ease, border-color .15s ease;
  }
  select:hover{ background:var(--bg); border-color:#D1D5DB; }
  .hint{ font-size:13px; color:var(--muted); text-align:center; margin-top:16px; }
  /* 尊重系統「減少動態效果」設定：關閉純裝飾的無限循環動畫 */
  @media (prefers-reduced-motion: reduce){
    .walking .bob, .flame, .steam, .spark, .twinkle, .quake{ animation:none; }
    .progress > div{ transition:none; }
  }

  /* ---------- SVG 動畫 ---------- */
  .bob{ transform-box:fill-box; transform-origin:50% 100%; }
  .walking .bob{ animation:bob .45s ease-in-out infinite alternate; }
  @keyframes bob{
    from{ transform:translateY(0) rotate(-1.6deg); }
    to  { transform:translateY(-6px) rotate(1.6deg); }
  }
  .flame{
    transform-box:fill-box; transform-origin:50% 100%;
    animation:flick .55s ease-in-out infinite alternate;
  }
  @keyframes flick{
    from{ transform:scaleY(.9) scaleX(1.05) rotate(-2.5deg); }
    to  { transform:scaleY(1.12) scaleX(.93) rotate(2.5deg); }
  }
  .steam{ animation:steamUp 1.7s linear infinite; opacity:0; }
  @keyframes steamUp{
    0%{ transform:translateY(8px); opacity:0; }
    30%{ opacity:.75; }
    100%{ transform:translateY(-30px); opacity:0; }
  }
  .dust{ animation:dustOut .75s ease-out forwards; transform-box:fill-box; transform-origin:center; }
  @keyframes dustOut{
    from{ transform:scale(.4); opacity:.85; }
    to  { transform:scale(2); opacity:0; }
  }
  .spark{ animation:sparkUp 1.9s linear infinite; }
  @keyframes sparkUp{
    0%{ transform:translateY(0); opacity:.95; }
    100%{ transform:translateY(-400px); opacity:0; }
  }
  .wobble{ animation:wob .6s ease-in-out; transform-box:fill-box; transform-origin:50% 92%; }
  @keyframes wob{
    0%{ transform:rotate(0); } 25%{ transform:rotate(15deg); }
    55%{ transform:rotate(-11deg); } 80%{ transform:rotate(6deg); } 100%{ transform:rotate(0); }
  }
  .quake{ animation:quake .7s linear; }
  @keyframes quake{
    0%,100%{ transform:translate(0,0) rotate(0); }
    12%{ transform:translate(-10px,6px) rotate(-.5deg); }
    30%{ transform:translate(9px,-7px) rotate(.5deg); }
    48%{ transform:translate(-8px,5px) rotate(-.4deg); }
    66%{ transform:translate(6px,-4px) rotate(.3deg); }
    84%{ transform:translate(-3px,2px) rotate(-.2deg); }
  }
  .lizard-anim{ animation:wig .8s ease-in-out infinite alternate; transform-box:fill-box; transform-origin:30% 60%; }
  .glassflip{ transform:scaleY(-1); }
  @keyframes wig{
    from{ transform:rotate(-4deg); }
    to  { transform:rotate(5deg) translateY(-2px); }
  }
  .twinkle{ animation:tw 1.1s ease-in-out infinite alternate; }
  @keyframes tw{ from{ opacity:.2; } to{ opacity:1; } }
  .emoji{ font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif; }
</style>
</head>

<script>
'use strict';
/* =========================================================
   測試工程師與酒吧 — 動態 SVG 故事
   架構：可暫停/可調速的邏輯時鐘 + 場景 token（跳幕時作廢舊動畫）
   ========================================================= */
const $ = id => document.getElementById(id);
const svgNS = 'http://www.w3.org/2000/svg';
const xlinkNS = 'http://www.w3.org/1999/xlink';

/* ---------------- 時鐘（可暫停、可調速） ---------------- */
const clock = { acc: 0, last: performance.now(), paused: false, speed: 1 };
(function tick(){
  const now = performance.now();
  if (!clock.paused) clock.acc += Math.min(now - clock.last, 100) * clock.speed;
  clock.last = now;
  requestAnimationFrame(tick);
})();

/* ---------------- 緩動 ---------------- */
const easeInOut = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
const easeOut   = t => 1 - Math.pow(1 - t, 3);
const easeIn    = t => t*t*t;

/* ---------------- 場景 token ---------------- */
let sceneToken = 0;
const alive = tok => tok === sceneToken;

/* ---------------- 姿態與補間 ---------------- */
function pose(x, y, s = 1, r = 0, cx = 0, cy = 0, o = 1){ return { x, y, s, r, cx, cy, o }; }
function applyPose(el, p){
  el.setAttribute('transform', `translate(${p.x} ${p.y}) rotate(${p.r} ${p.cx} ${p.cy}) scale(${p.s})`);
  el.style.opacity = p.o;
}
function tween(el, from, to, dur, delay = 0, ease = easeInOut, tok = sceneToken){
  const t0 = clock.acc + delay;
  return new Promise(res => {
    (function frame(){
      if (tok !== sceneToken) return res(false);
      const raw = clock.acc - t0;
      if (raw >= dur){ applyPose(el, to); return res(true); }
      if (raw >= 0){
        const t = ease(Math.max(0, raw) / dur);
        applyPose(el, {
          x: from.x + (to.x - from.x) * t,
          y: from.y + (to.y - from.y) * t,
          s: from.s + (to.s - from.s) * t,
          r: from.r + (to.r - from.r) * t,
          cx: from.cx + (to.cx - from.cx) * t,
          cy: from.cy + (to.cy - from.cy) * t,
          o: from.o + (to.o - from.o) * t,
        });
      }
      requestAnimationFrame(frame);
    })();
  });
}
function wait(ms, tok = sceneToken){
  const t0 = clock.acc + ms;
  return new Promise(res => {
    (function f(){
      if (tok !== sceneToken) return res(false);
      if (clock.acc >= t0) return res(true);
      requestAnimationFrame(f);
    })();
  });
}
function fade(el, from, to, dur, delay = 0, tok = sceneToken){
  const t0 = clock.acc + delay;
  return new Promise(res => {
    (function f(){
      if (tok !== sceneToken) return res(false);
      const raw = clock.acc - t0;
      if (raw >= dur){ el.style.opacity = to; return res(true); }
      if (raw >= 0) el.style.opacity = from + (to - from) * (raw / dur);
      requestAnimationFrame(f);
    })();
  });
}

/* ---------------- SVG 工具 ---------------- */
function E(name, attrs = {}, parent = null){
  const n = document.createElementNS(svgNS, name);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (parent) parent.appendChild(n);
  return n;
}
const fx = $('fx');
function useFx(id, x, y, s = 1, o = 1){
  const u = E('use', { transform: `translate(${x} ${y}) scale(${s})` }, fx);
  u.setAttribute('href', id);
  u.setAttributeNS(xlinkNS, 'xlink:href', id);
  u.style.opacity = o;
  return u;
}
function floatText(str, x, y, o = {}){
  const { size = 24, fill = '#f2c14e', dur = 1400, rise = 36, delay = 0, tok = sceneToken } = o;
  const g = E('g', {}, fx);
  const t = E('text', { 'text-anchor': 'middle', 'font-size': size, fill, 'font-weight': 'bold' }, g);
  t.textContent = str;
  g.style.opacity = 0;
  const p0 = pose(x, y, 1, 0, 0, 0, 0);
  const p1 = pose(x, y - rise, 1, 0, 0, 0, 1);
  tween(g, p0, p1, Math.min(380, dur * .35), delay, easeOut, tok)
    .then(ok => ok && wait(dur, tok))
    .then(ok => { if (ok) tween(g, p1, pose(x, y - rise, 1, 0, 0, 0, 0), 320, 0, easeOut, tok); });
  return g;
}
function steam(x, y, tok = sceneToken, n = 3){
  for (let i = 0; i < n; i++){
    const g = E('g', { transform: `translate(${x + (i - n/2) * 9} ${y})` }, fx);
    const p = E('path', { d: 'M 0,4 q 5,-7 0,-14 q -5,-7 0,-14', stroke: '#d8dfe6', 'stroke-width': 2.5, fill: 'none', class: 'steam' }, g);
    p.style.animationDelay = (i * .4) + 's';
  }
}
function dustPuff(x, y, tok = sceneToken, n = 3){
  for (let i = 0; i < n; i++){
    E('circle', { cx: x + (i - n/2) * 16, cy: y + (i % 2 ? 6 : -4), r: 8 + (i % 3) * 3, fill: '#c9b8a0', class: 'dust' }, fx);
  }
  wait(820, tok).then(() => { fx.querySelectorAll('.dust').forEach(e => e.remove()); });
}
function makeGlass(x, y, level, tok = sceneToken){
  const g = E('g', { transform: `translate(${x} ${y})` }, fx);
  const inner = E('g', {}, g);
  E('path', { d: 'M -13,-46 L 13,-46 L 10,0 L -10,0 Z', fill: 'rgba(220,236,245,.16)', stroke: '#9fb8c8', 'stroke-width': 2 }, inner);
  if (level > 0){
    const h = 40 * level, hw = 10 + 3 * (h / 46);
    E('path', { d: `M ${-hw},${-h} L ${hw},${-h} L 10,0 L -10,0 Z`, fill: '#f6b93b', opacity: .9 }, inner);
    E('ellipse', { cx: 0, cy: -h, rx: hw, ry: 3, fill: '#fff6df', opacity: .9 }, inner);
  }
  return g;
}
function textW(str, fs){
  let w = 0;
  for (const ch of str) w += ch.charCodeAt(0) > 0x2E7F ? fs * 1.02 : fs * .58;
  return w;
}
function showBubble(which, str, fs = 24, delay = 0, tok = sceneToken){
  const b    = $(which === 't' ? 'bubbleT' : 'bubbleB');
  const rect = $(which === 't' ? 'bubbleTrect' : 'bubbleBrect');
  const text = $(which === 't' ? 'bubbleTtext' : 'bubbleBtext');
  const tail = $(which === 't' ? 'bubbleTtail' : 'bubbleBtail');
  const w = textW(str, fs) + 36, h = fs + 24;
  rect.setAttribute('x', -w/2); rect.setAttribute('y', -h/2);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', 14);
  text.setAttribute('x', 0); text.setAttribute('y', fs * .35);
  text.setAttribute('font-size', fs);
  text.textContent = str;
  tail.setAttribute('points', `${-9},${h/2 - 1} ${9},${h/2 - 1} ${2},${h/2 + 13}`);
  const cx = which === 't' ? 650 : 950, cy = which === 't' ? 344 : 240;
  b.style.opacity = 0;
  tween(b, pose(cx, cy, .82, 0, 0, 0, 0), pose(cx, cy, 1, 0, 0, 0, 1), 220, delay, easeOut, tok);
  return b;
}
function hideBubble(which){
  $(which === 't' ? 'bubbleT' : 'bubbleB').style.opacity = 0;
}

async function testerWalk(from, to, dur, tok = sceneToken, ease = easeInOut){

function openDoor(which, dur = 400, tok = sceneToken){
  const leaf = $(which === 'front' ? 'frontDoorLeaf' : 'backDoorLeaf');
  const r = which === 'front' ? -75 : 75;
  const c = which === 'front' ? 66 : 1186;
  return tween(leaf, pose(0, 0, 1, 0, c, 359, 1), pose(0, 0, 1, r, c, 359, 1), dur, 0, easeInOut, tok);
}
function closeDoor(which, dur = 400, tok = sceneToken){
  const leaf = $(which === 'front' ? 'frontDoorLeaf' : 'backDoorLeaf');
  const r = which === 'front' ? -75 : 75;
  const c = which === 'front' ? 66 : 1186;
  return tween(leaf, pose(0, 0, 1, r, c, 359, 1), pose(0, 0, 1, 0, c, 359, 1), dur, 0, easeInOut, tok);
}
function shake(el, dur = 700, amp = 7, cx = 600, cy = 400, tok = sceneToken){
  const n = 6;
  let prev = { x: 0, y: 0, s: 1, r: 0, cx, cy, o: 1 };
  let chain = Promise.resolve(true);
  for (let i = 0; i < n; i++){
    const k = 1 - i / n;
    const to = { x: (i % 2 ? 1 : -1) * amp * k, y: 0, s: 1, r: (i % 2 ? 1 : -1) * 1.6 * k, cx, cy, o: 1 };
    chain = chain.then(ok => {
      if (!ok) return false;
      return tween(el, prev, to, dur / n, 0, t => t, tok).then(r => { if (r) prev = to; return r; });
    });
  }
  return chain.then(ok => { if (ok) el.setAttribute('transform', ''); return ok; });
}

  E('path', { d: 'M -11,-84 Q -11,-96 0,-96 Q 11,-96 11,-84 Q 0,-91 -11,-84 Z', fill: '#2b2b33' }, g);
  return g;
}

/* =========================================================
   播放控制
   ========================================================= */
const state = { i: 0, ended: false };
const capEl = $('caption');

async function typeCaption(str, tok){
  capEl.textContent = '';
  for (const ch of str){
    if (tok !== sceneToken) return;
    capEl.textContent += ch;
    await wait(26, tok);
  }
}
function updateHud(){
  $('sceneNum').textContent = `第 ${state.i + 1} / ${SCENES.length} 幕`;
  $('progressBar').style.width = ((state.i + 1) / SCENES.length * 100) + '%';
}
function updatePlayBtn(){
  const b = $('btnPlay');
  b.textContent = state.ended ? '↻ 重播' : (clock.paused ? '▶ 播放' : '⏸ 暫停');
}
function goto(i){
  sceneToken++;
  const tok = sceneToken;
  state.i = Math.max(0, Math.min(SCENES.length - 1, i));
  state.ended = false;
  clock.paused = false;
  updateHud();
  updatePlayBtn();
  resetStage();
  typeCaption(SCENES[state.i].text, tok);
  SCENES[state.i].run(tok).then(async ok => {
    if (tok !== sceneToken) return;
    if (state.i < SCENES.length - 1) {
      if (!(await wait(1000, tok))) return;
      goto(state.i + 1);
    }
    else { state.ended = true; updatePlayBtn(); }
  });
}
$('btnPlay').addEventListener('click', () => {
  if (state.ended) return goto(0);
  clock.paused = !clock.paused;
  updatePlayBtn();
});
$('btnNext').addEventListener('click', () => goto(state.i + 1));
$('btnPrev').addEventListener('click', () => goto(state.i - 1));
$('btnRestart').addEventListener('click', () => goto(0));
$('selSpeed').addEventListener('change', e => { clock.speed = parseFloat(e.target.value); });
document.addEventListener('keydown', e => {
  if (e.code === 'Space'){ e.preventDefault(); $('btnPlay').click(); }
  else if (e.key === 'ArrowRight') goto(state.i + 1);
  else if (e.key === 'ArrowLeft') goto(state.i - 1);
});

/* 開演 */
goto(0);
</script>
</body>
</html>
