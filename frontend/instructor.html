<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F8F9FA" />
    <title>EduGenAI Instructor Studio</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="min-h-screen bg-[#F8F9FA] font-sans text-[#262626] antialiased">
    <div id="auth-status" class="mx-auto mt-12 max-w-xl rounded-lg border border-gray-200 bg-white p-6 text-center shadow-sm" role="status" aria-live="polite">
      Checking your instructor session…
    </div>
    <main class="min-h-screen" hidden>
      <header class="sticky top-0 z-20 border-b border-gray-200 bg-white">
        <nav class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4" aria-label="Main navigation">
          <a class="text-lg font-bold text-[#A21942]" href="/instructor.html">EduGenAI Instructor Studio</a>
          <button id="logout-button" type="button" class="rounded-md bg-[#A21942] px-4 py-2 font-medium text-white transition-colors hover:bg-[#801333]">Sign out</button>
        </nav>
      </header>
      <p id="logout-feedback" class="mx-auto mt-3 hidden max-w-7xl px-4 text-sm text-red-700" role="alert"></p>
      <div id="instructor-app"></div>
    </main>
    <script type="module" src="/src/instructor-auth.ts"></script>
    <script type="module" src="/src/instructor-app.tsx"></script>
  </body>
</html>
