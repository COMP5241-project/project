<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F8F9FA" />
    <title>Instructor Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-[#F8F9FA] font-sans text-[#262626] antialiased">
    <header class="border-b border-gray-200 bg-white">
      <nav class="mx-auto flex w-full max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8" aria-label="Main navigation">
        <a class="inline-flex items-center gap-3" href="/index.html" aria-label="PolyU Learning Portal home">
          <span class="grid size-10 place-items-center rounded-md bg-[#A21942] text-lg font-bold text-white" aria-hidden="true">P</span>
          <span class="border-l border-gray-300 pl-3">
            <span class="block text-lg font-bold leading-tight">PolyU</span>
            <span class="block text-[11px] font-semibold uppercase leading-tight text-gray-500">Learning Portal</span>
          </span>
        </a>
        <button
          id="logout-button"
          type="button"
          class="rounded-md bg-[#A21942] px-4 py-2 font-medium text-white transition-colors hover:bg-[#801333] focus:outline-none focus:ring-2 focus:ring-[#A21942] focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-70"
        >
          Logout
        </button>
      </nav>
    </header>

    <main class="mx-auto w-full max-w-7xl px-4 py-12 sm:px-6 lg:px-8">
      <section class="mx-auto max-w-3xl rounded-lg border border-gray-200 bg-white p-6 shadow-sm sm:p-8" aria-labelledby="welcome-heading">
        <div class="rounded-md border border-emerald-200 bg-emerald-50 p-5 text-emerald-800" role="status">
          <p class="mb-2 text-sm font-semibold">Instructor onboarding</p>
          <h1 id="welcome-heading" class="text-2xl font-bold text-[#262626]">Instructor Studio</h1>
          <p class="mt-2">Welcome, Instructor! Here you can manage student onboarding.</p>
        </div>
        <p id="logout-feedback" class="mt-4 hidden rounded-md border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800" role="alert" aria-live="polite"></p>
      </section>
    </main>

    <script type="module" src="/role.js"></script>
  </body>
</html>
