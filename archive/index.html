<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F8F9FA" />
    <title>Sign In | PolyU</title>
  </head>
  <body class="min-h-screen bg-[#F8F9FA] font-sans text-[#262626] antialiased">
    <main class="flex min-h-screen flex-col">
      <header class="mx-auto flex w-full max-w-7xl items-center px-4 py-6 sm:px-6 lg:px-8">
        <a class="inline-flex items-center gap-3" href="/" aria-label="PolyU sign-in home">
          <span class="grid size-10 place-items-center rounded-md bg-[#A21942] text-lg font-bold text-white" aria-hidden="true">P</span>
          <span class="border-l border-gray-300 pl-3">
            <span class="block text-lg font-bold leading-tight tracking-normal">PolyU</span>
            <span class="block text-[11px] font-semibold uppercase leading-tight tracking-normal text-gray-500">Learning Portal</span>
          </span>
        </a>
      </header>

      <section class="flex flex-1 items-center justify-center px-4 pb-16 pt-8 sm:px-6">
        <div class="w-full max-w-md">
          <div class="mb-7 text-center">
            <p class="mb-2 text-sm font-semibold text-[#A21942]">Account Sign In</p>
            <h1 class="text-3xl font-bold tracking-normal text-[#262626]">Welcome Back</h1>
            <p class="mt-2 text-sm text-gray-600">Continue with your PolyU account</p>
          </div>

          <div class="rounded-lg border border-gray-200 bg-white p-6 shadow-sm sm:p-8">
            <div id="feedback" class="mb-5 hidden rounded-md border px-4 py-3 text-sm" role="alert" aria-live="polite"></div>

            <form id="login-form" class="space-y-5" novalidate>
              <div>
                <label for="email" class="mb-1.5 block text-sm font-medium text-[#262626]">Email</label>
                <input
                  id="email"
                  name="email"
                  type="email"
                  autocomplete="username"
                  required
                  class="w-full rounded-md border border-gray-300 bg-white px-3.5 py-3 text-sm text-[#262626] outline-none transition placeholder:text-gray-400 focus:border-[#A21942] focus:ring-2 focus:ring-[#A21942]/20"
                  placeholder="name@polyu.edu.hk"
                />
              </div>

              <div>
                <label for="password" class="mb-1.5 block text-sm font-medium text-[#262626]">Password</label>
                <input
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  required
                  class="w-full rounded-md border border-gray-300 bg-white px-3.5 py-3 text-sm text-[#262626] outline-none transition placeholder:text-gray-400 focus:border-[#A21942] focus:ring-2 focus:ring-[#A21942]/20"
                  placeholder="Enter your password"
                />
              </div>

              <button
                id="submit-button"
                type="submit"
                class="inline-flex w-full items-center justify-center gap-2 rounded-md bg-[#A21942] px-4 py-3 text-sm font-medium text-white transition-colors hover:bg-[#801333] focus:outline-none focus:ring-2 focus:ring-[#A21942] focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-70"
              >
                <span id="submit-spinner" class="hidden size-4 animate-spin rounded-full border-2 border-white/40 border-t-white" aria-hidden="true"></span>
                <span id="submit-label">Sign In</span>
              </button>
            </form>
          </div>

          <p class="mt-6 text-center text-xs text-gray-500">The Hong Kong Polytechnic University · PolyU</p>
        </div>
      </section>
    </main>
    <script type="module" src="/login.js"></script>
  </body>
</html>
